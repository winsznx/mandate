name: CI

on:
  push:
    branches: [main, auto/mandate]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fork and chain-read tests need a BSC endpoint. Overridable by a repo secret
  # when the public node rate-limits.
  RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL || 'https://bsc-testnet-rpc.publicnode.com' }}
  BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL || 'https://bsc-testnet-rpc.publicnode.com' }}

jobs:
  node:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # trial-runner forks a real chain with anvil; without it on PATH every
      # fork test fails FORK_SPAWN_FAILED instead of running or skipping.
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  contracts:
    name: forge test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge build
        run: forge build
        working-directory: contracts
      - name: forge test
        run: forge test -vv
        working-directory: contracts

  agent-cards:
    name: agent cards are in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: re-emit and diff
        run: |
          node scripts/emit-agent-cards.mjs
          node scripts/emit-published-snapshot.mjs
          git diff --exit-code artifacts/agents apps/web/src/marketplace/published-snapshot.generated.ts
