[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
# Deterministic bytecode keeps `guardCodeHash` in an AuthorityIR reproducible
# from source, which is the point of pinning it at all.

fs_permissions = [{ access = "read", path = "./fixtures" }]

[profile.default.fuzz]
runs = 512
max_test_rejects = 100000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 1024
depth = 128

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
bsc_archive = "${BSC_ARCHIVE_RPC_URL}"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
